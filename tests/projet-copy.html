<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucie Freihaut | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-unbounded { font-family: 'Unbounded', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900 overflow-x-hidden">
    
    <section class="max-w-6xl mx-auto px-6 pt-32 pb-16">
    <div class="flex flex-col md:flex-row justify-between items-end gap-8 mb-12">
        <div class="max-w-2xl">
            <h1 class="font-unbounded text-5xl md:text-7xl font-black mb-6 uppercase tracking-tighter">Shooter VR</h1>
            <p class="text-xl text-gray-600 leading-relaxed">Conception d'un environnement immersif et d'un système de tir réaliste pour Oculus Quest 2.</p>
        </div>
        <div class="grid grid-cols-2 gap-8 border-l border-gray-100 pl-8">
            <div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Rôle</p>
                <p class="font-medium">Développeuse Unity</p>
            </div>
            <div>
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Stack</p>
                <p class="font-medium text-[#1D24CA]">C# / Unity / VR</p>
            </div>
        </div>
    </div>
    <div class="rounded-[2.5rem] overflow-hidden shadow-2xl bg-gray-100 aspect-video">
        <img src="images/projets/shooter-vr-full.jpg" class="w-full h-full object-cover">
    </div>
</section>

<section class="bg-gray-50 py-20 rounded-[3rem]">
    <div class="max-w-6xl mx-auto px-6">
        <h2 class="font-unbounded text-3xl font-bold mb-12 text-[#1D24CA]">Fonctionnalités</h2>
        <div class="grid md:grid-cols-3 gap-8">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <div class="text-3xl mb-4">🎯</div>
                <h3 class="font-bold text-lg mb-2">Système de tir</h3>
                <p class="text-sm text-gray-600">Calcul de trajectoires paraboliques et gestion des impacts en temps réel.</p>
            </div>
            </div>
    </div>
</section>

</html>
